<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | LoopKeeper</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-body"><main class="login-shell"><section class="login-intro"><a class="brand light" href="/dashboard"><strong>LoopKeeper</strong><span>Meeting Accountability Engine</span></a><h1>Turn meeting conversations into accountable work.</h1><p>Create meetings, capture voice, review AI task suggestions, assign work and approve submissions.</p></section><section class="login-card"><div class="tabs"><button id="loginTab" class="tab active" onclick="showAuth('login')">Login</button><button id="registerTab" class="tab" onclick="showAuth('register')">Create Account</button></div><div id="loginForm"><h2>Welcome back</h2><input id="loginEmail" placeholder="Email" type="email"><input id="loginPassword" placeholder="Password" type="password"><button class="wide" onclick="login()">Login</button></div><div id="registerForm" class="hidden"><h2>Create your account</h2><input id="registerName" placeholder="Your name"><input id="registerEmail" placeholder="Email" type="email"><input id="registerPassword" placeholder="Password" type="password"><button class="wide" onclick="register()">Create Account</button></div><div class="divider">or</div><div id="googleLogin"><p class="muted">Checking Google sign-in configuration…</p></div></section></main><div id="toast"></div><script src="https://accounts.google.com/gsi/client" async defer></script><script src="/static/script.js"></script></body></html>
